apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "shopflow.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "shopflow.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shopflow.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "shopflow.image" (dict "root" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # "api" is the Service name; cluster DNS resolves it inside the namespace.
            - name: API_UPSTREAM
              value: api:8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "shopflow.containerSecurity" . | nindent 12 }}
          # Root filesystem is read-only. nginx still needs two writable places:
          # /tmp (pid file, temp files) and conf.d (config rendered at start).
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "shopflow.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  selector:
    {{- include "shopflow.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
