apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "shopflow.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "shopflow.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shopflow.labels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Pods do not restart when a ConfigMap changes. This hash changes with
        # the ConfigMap content, which changes the pod template, which triggers
        # a rolling update.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ include "shopflow.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: shopflow-config }
          env:
            {{- include "shopflow.databaseEnv" . | nindent 12 }}
          # Liveness fails -> kubelet restarts the container.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness fails -> pod is removed from the Service; no restart.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # Startup probe: liveness and readiness wait until this passes once.
          # 60 x 2s = up to 2 minutes, matching the api's wait for Postgres.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "shopflow.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "shopflow.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "shopflow.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
