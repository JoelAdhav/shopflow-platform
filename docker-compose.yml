# Local stack: web -> api -> postgres, api -> redis -> worker -> postgres.
# Start:  docker compose up -d --build     Open: http://localhost:8080
name: shopflow

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data survives "down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine3.22
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    image: shopflow-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SEED_DATA: "true"
    ports:
      - "8000:8000"   # direct access for curl and /docs
    depends_on:
      postgres:
        condition: service_healthy   # wait for "healthy", not just "started"
      redis:
        condition: service_healthy
    healthcheck:
      # No curl in the slim image, so use Python itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./services/worker
    image: shopflow-worker:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "9100:9100"   # /metrics
    depends_on:
      api:
        condition: service_healthy   # api creates the tables
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./services/web
    image: shopflow-web:local
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to IPv6 ::1 first,
      # and nginx here listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
